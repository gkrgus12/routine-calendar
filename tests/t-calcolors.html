<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>캘린더별 색</title>
<link rel="stylesheet" href="../styles.css"></head>
<body><div class="app" id="app"></div>
<script src="lib.js"></script>
<script>
// 캘린더별 색 지정. GIS·fetch 스텁(t-calendars 와 같은 꼴). 캘린더 2개(기본 + 팀) 중 팀을 빨강(약속 색 2 = --e1)으로 지정하면
// 팀 캘린더 이벤트만 빨강, 기본 캘린더는 구글 기본색(backgroundColor), 로컬 약속은 설정의 약속 색. 월·주·일 즉시 반영, 범례 칩, 체크 해제 뒤에도 색 유지
const EV='https://www.googleapis.com/auth/calendar.events',LS='https://www.googleapis.com/auth/calendar.calendarlist.readonly';
window.GOOGLE_CLIENT_ID='test-client';
window.google={accounts:{oauth2:{initTokenClient(cfg){return {requestAccessToken(req){setTimeout(()=>cfg.callback({access_token:'t1',expires_in:3599,scope:EV+' '+LS}),0)}}},revoke(){}}}};
const PRIMARY='me@example.com',TEAM='team@group.calendar.google.com';
const calList={items:[{id:TEAM,summary:'팀 캘린더',backgroundColor:'#f83a22',accessRole:'writer'},{id:PRIMARY,summary:'나',primary:true,backgroundColor:'#9fe1e7',accessRole:'owner'}]};
const EVENTS={};const calls=[];
window.fetch=(url,init)=>{
  const m=(init&&init.method)||'GET';const c={m,url};calls.push(c);log('fetch',m,url);
  const u=new URL(url);const path=decodeURIComponent(u.pathname);
  const ok=b=>Promise.resolve({ok:true,status:200,json:()=>Promise.resolve(b)});
  const err=(st,b)=>Promise.resolve({ok:false,status:st,statusText:'err',json:()=>Promise.resolve(b)});
  if(/\/users\/me\/calendarList$/.test(path))return ok(calList);
  const mm=/\/calendars\/([^/]+)\/events(?:\/([^/]+))?$/.exec(path);if(!mm)return err(404,{error:{message:'not found: '+path}});
  const calId=mm[1]==='primary'?PRIMARY:mm[1];
  if(m==='GET'&&u.searchParams.get('fields')==='summary')return ok({summary:PRIMARY});
  if(m==='GET')return ok({items:EVENTS[calId]||[]});
  return err(500,{error:{message:'unexpected'}});
};
const KEY='routine-cal-google-calendar-colors';
const RED='var(--e1)',RED_HEX='#c62828'; // 약속 색 2 = 레드(라이트)

run(async()=>{
  // 2026-10-12(월) 주. 로컬 약속 하나(화 15~16)는 연결 뒤에도 남아 설정 색을 써야 한다
  seed({pages:[{id:'p1',name:'학교',color:0,active:true,colorByLabel:false,items:[{id:'i1',day:0,start:'09:00',end:'10:00',label:'수업'}]}],
    events:[{id:'l1',title:'로컬 약속',startDate:'2026-10-13',endDate:'2026-10-13',startTime:'15:00',endTime:'16:00',note:''}],
    settings:{defaultStart:'10:00',defaultDur:60,weekStart:'mon',dayStart:6,dayEnd:24,eventColor:0,theme:'light'}});
  await loadApp();
  const dt=(date,time)=>{const x=RC.parse(date);x.setMinutes(RC.toMin(time));return x.toISOString()};
  EVENTS[PRIMARY]=[{id:'p1e',summary:'내 일정',start:{dateTime:dt('2026-10-13','10:00')},end:{dateTime:dt('2026-10-13','11:00')}},
                   {id:'p1a',summary:'종일 내 일정',start:{date:'2026-10-13'},end:{date:'2026-10-14'}}];
  EVENTS[TEAM]=[{id:'t1',summary:'팀 회의',start:{dateTime:dt('2026-10-13','13:00')},end:{dateTime:dt('2026-10-13','14:00')}},
                {id:'t1a',summary:'종일 팀',start:{date:'2026-10-13'},end:{date:'2026-10-14'}}];
  RC.view.type='month';RC.view.ym='2026-10';RC.render();await sleep(20);
  const chip=t=>[...document.querySelectorAll('.mgrid .ev')].find(e=>e.textContent.includes(t));
  const blk=t=>[...document.querySelectorAll('.wgrid .blk.evb')].find(b=>b.title.startsWith(t));
  const wad=t=>[...document.querySelectorAll('.wgrid .wad .ev')].find(b=>b.title.startsWith(t));
  const sty=el=>el?(el.getAttribute('style')||'').replace(/\s+/g,''):'(없음)';
  const ibg=el=>el?(el.style.backgroundColor||el.style.getPropertyValue('background').trim()):'(없음)',ink=el=>el?el.style.color:'(없음)'; // 인라인 hex 는 rgb(...) 로 정규화되고, var() 는 longhand 로 안 읽혀 shorthand 로 읽는다
  const ME='rgb(159, 225, 231)',TEAMG='rgb(248, 58, 34)',WHITE='rgb(255, 255, 255)',DARK='rgb(20, 24, 29)';
  const bg=el=>el?getComputedStyle(el).backgroundColor:'(없음)';
  const rgb=el=>{const v=bg(el);const n=(v.match(/[\d.]+/g)||[]).map(Number);return v.startsWith('color(')?n.map(x=>Math.round(x*255)):n}; // color-mix 결과는 color(srgb r g b) 꼴
  const chipEc=t=>{const e=chip(t);return e?e.style.getPropertyValue('--ec').trim():'(없음)'};
  const legend=()=>[...document.querySelectorAll('.legend span')].map(s=>({t:s.textContent.trim(),c:s.querySelector('i').style.background,cls:s.className}));
  const rowFor=name=>[...document.querySelectorAll('.md.settings .callist .crow')].find(r=>r.textContent.includes(name));
  const swOf=(name,title)=>[...rowFor(name).querySelectorAll('.swatches.cal button')].find(b=>b.title===title);
  const boxFor=name=>rowFor(name).querySelector('input[type=checkbox]');
  const openGoogleTab=async()=>{btn('⚙ 설정').click();await sleep(40);btn('구글').click();await sleep(30)};
  const closeTab=async()=>{btn('닫기').click();await sleep(40)};
  const toWeek=async()=>{RC.view.type='week';RC.view.weekStart=new Date(2026,9,12);RC.render();await sleep(30)};
  const toDay=async()=>{RC.view.type='day';RC.view.day='2026-10-13';RC.render();await sleep(30)};
  const toMonth=async()=>{RC.view.type='month';RC.view.ym='2026-10';RC.render();await sleep(30)};

  // 연결 + 팀 캘린더 체크
  await openGoogleTab();btn('Google 연결').click();await sleep(300);
  check('연결됨 + 캘린더 2개',/연결됨: me@example\.com/.test(text('.md.settings'))&&document.querySelectorAll('.md.settings .callist .crow').length===2);
  check('각 항목에 스와치 7개(G + 6색), 기본은 G 선택',[...document.querySelectorAll('.md.settings .callist .crow')].every(r=>r.querySelectorAll('.swatches.cal button').length===7&&r.querySelector('.swatches.cal button.sel').classList.contains('auto')));
  check('G 스와치 배경은 구글 기본색',/f83a22|248,58,34/i.test(sty(swOf('팀 캘린더','구글 기본색 사용'))),sty(swOf('팀 캘린더','구글 기본색 사용')));
  boxFor('팀 캘린더').click();await sleep(200);await closeTab();
  // 기본 상태: 둘 다 구글 기본색, 로컬은 설정 색
  check('월간 기본: 팀=구글색, 나=구글색, 로컬=설정색(--e0)',chipEc('팀 회의')==='#f83a22'&&chipEc('내 일정')==='#9fe1e7'&&chipEc('로컬 약속')==='var(--e0)',{team:chipEc('팀 회의'),me:chipEc('내 일정'),local:chipEc('로컬 약속')});
  check('월간 종일 칩도 캘린더 색',chipEc('종일 팀')==='#f83a22'&&chipEc('종일 내 일정')==='#9fe1e7');
  await toWeek();
  check('주간 범례: 루틴 페이지 칩 다음 캘린더 2개(이름+색), 로컬 약속 칩',(()=>{const l=legend();const me=l.find(x=>x.t==='나'),tm=l.find(x=>x.t==='팀 캘린더'),loc=l.find(x=>x.t==='약속');return !!me&&!!tm&&!!loc&&/159, 225, 231/.test(me.c)&&/248, 58, 34/.test(tm.c)&&loc.c==='var(--e0)'&&l.findIndex(x=>x.t==='학교')<l.findIndex(x=>x.t==='나')&&l.findIndex(x=>x.t==='나')<l.findIndex(x=>x.t==='팀 캘린더')})(),legend());
  await toMonth();

  // 팀 캘린더 → 빨강(약속 색 2)
  await openGoogleTab();swOf('팀 캘린더','약속 색 2').click();await sleep(60);
  check('저장 키에 {팀: 1}',JSON.stringify(JSON.parse(localStorage.getItem(KEY)||'{}'))===JSON.stringify({[TEAM]:1}),localStorage.getItem(KEY));
  check('스와치 선택 상태 반영',swOf('팀 캘린더','약속 색 2').classList.contains('sel')&&!swOf('팀 캘린더','구글 기본색 사용').classList.contains('sel')&&swOf('나','구글 기본색 사용').classList.contains('sel'));
  check('항목의 색 점도 빨강',sty(rowFor('팀 캘린더').querySelector('.cdot')).includes('var(--e1)'),sty(rowFor('팀 캘린더').querySelector('.cdot')));
  // 모달을 닫지 않고도 뒤의 월간 뷰가 바로 바뀌어 있어야 한다(즉시 반영)
  check('월간 즉시 반영: 팀만 빨강, 나는 구글색, 로컬은 설정색',chipEc('팀 회의')===RED&&chipEc('종일 팀')===RED&&chipEc('내 일정')==='#9fe1e7'&&chipEc('로컬 약속')==='var(--e0)',{team:chipEc('팀 회의'),me:chipEc('내 일정'),local:chipEc('로컬 약속')});
  check('월간 칩 실제 배경이 빨강 계열(color-mix)',(()=>{const [r,g,b]=rgb(chip('팀 회의'));return r>g+20&&r>b+20})(),bg(chip('팀 회의')));
  await closeTab();
  await toWeek();
  check('주간 범례 팀 칩 빨강, 나 칩 구글색',legend().find(x=>x.t==='팀 캘린더').c===RED&&/159, 225, 231/.test(legend().find(x=>x.t==='나').c),legend());
  check('주간: 팀 블록 빨강(흰 글자), 나 블록 구글색(어두운 글자), 로컬 설정색',ibg(blk('팀 회의'))===RED&&ink(blk('팀 회의'))===WHITE&&ibg(blk('내 일정'))===ME&&ink(blk('내 일정'))===DARK&&ibg(blk('로컬 약속'))==='var(--e0)',{team:sty(blk('팀 회의')),me:sty(blk('내 일정')),local:sty(blk('로컬 약속'))});
  check('주간 실제 배경',bg(blk('팀 회의'))==='rgb(198, 40, 40)'&&bg(blk('내 일정'))==='rgb(159, 225, 231)',{team:bg(blk('팀 회의')),me:bg(blk('내 일정'))});
  check('주간 종일 줄도 캘린더 색',ibg(wad('종일 팀'))===RED&&ibg(wad('종일 내 일정'))===ME,{t:sty(wad('종일 팀')),m:sty(wad('종일 내 일정'))});
  await toDay();
  check('일간: 팀 빨강, 나 구글색, 로컬 설정색',ibg(blk('팀 회의'))===RED&&ibg(blk('내 일정'))===ME&&ibg(blk('로컬 약속'))==='var(--e0)',{team:ibg(blk('팀 회의')),me:ibg(blk('내 일정')),local:ibg(blk('로컬 약속'))});
  check('일간 범례',legend().find(x=>x.t==='팀 캘린더').c===RED&&!!legend().find(x=>x.t==='나'));

  // 설정의 약속 색을 바꾸면 로컬만 따라오고 구글 쪽은 그대로
  RC.S.settings.eventColor=3;RC.save();await toWeek();
  check('설정 약속 색 변경: 로컬만 --e3, 팀 빨강·나 구글색 유지',ibg(blk('로컬 약속'))==='var(--e3)'&&ibg(blk('팀 회의'))===RED&&ibg(blk('내 일정'))===ME,{team:ibg(blk('팀 회의')),me:ibg(blk('내 일정')),local:ibg(blk('로컬 약속'))});

  // 체크 해제 → 이벤트·범례에서 빠지지만 색 설정은 유지. 재체크 → 다시 빨강
  await toMonth();await openGoogleTab();boxFor('팀 캘린더').click();await sleep(80);
  check('해제 뒤에도 저장 키 유지 + 스와치 선택 유지',JSON.parse(localStorage.getItem(KEY))[TEAM]===1&&swOf('팀 캘린더','약속 색 2').classList.contains('sel'));
  await closeTab();
  check('해제: 팀 이벤트 사라짐',!chip('팀 회의')&&!!chip('내 일정'));
  await toWeek();
  check('해제: 범례에서 팀 칩 사라짐, 나 칩 유지',!legend().find(x=>x.t==='팀 캘린더')&&!!legend().find(x=>x.t==='나'),legend());
  await toMonth();
  await openGoogleTab();boxFor('팀 캘린더').click();await sleep(80);await closeTab();
  check('재체크: 다시 빨강',chipEc('팀 회의')===RED);
  await toWeek();
  check('재체크: 범례 팀 칩 다시 빨강',(legend().find(x=>x.t==='팀 캘린더')||{}).c===RED,legend());
  await toMonth();

  // 기본 캘린더를 다른 색으로, 팀을 다시 구글 기본색으로
  await openGoogleTab();swOf('나','약속 색 3').click();await sleep(60);swOf('팀 캘린더','구글 기본색 사용').click();await sleep(60);
  check('키: {나: 2} 만 남음(팀은 null → 삭제)',JSON.stringify(JSON.parse(localStorage.getItem(KEY)))===JSON.stringify({[PRIMARY]:2}),localStorage.getItem(KEY));
  check('나=--e2, 팀=구글색 즉시 반영',chipEc('내 일정')==='var(--e2)'&&chipEc('팀 회의')==='#f83a22',{me:chipEc('내 일정'),team:chipEc('팀 회의')});
  await closeTab();
  // 드래그 생성 고스트는 primary 색
  await toWeek();
  const dcol=document.querySelectorAll('.wgrid .tcol')[3]; // 목요일 열(빈 시간)
  if(dcol){const r=dcol.getBoundingClientRect();const pd=(t,x,y)=>dcol.dispatchEvent(new PointerEvent(t,{bubbles:true,cancelable:true,clientX:x,clientY:y,pointerId:1,pointerType:'mouse',button:0,buttons:1}));
    pd('pointerdown',r.left+20,r.top+200);pd('pointermove',r.left+20,r.top+260);await sleep(10);
    const g=document.querySelector('.wgrid .blk.ghost');
    check('드래그 생성 고스트는 기본 캘린더 색(--e2)',!!g&&ibg(g)==='var(--e2)',g?sty(g):'(고스트 없음)');
    pd('pointerup',r.left+20,r.top+260);await sleep(30);document.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape'}));await sleep(30)}
  else log('열 요소를 찾지 못해 고스트 검사 생략');

  // 새로고침 뒤에도 색 유지(키는 localStorage)
  await openGoogleTab();btn('새로고침').click();await sleep(300);await closeTab();
  await toMonth();
  check('새로고침 뒤에도 색 유지',chipEc('내 일정')==='var(--e2)'&&chipEc('팀 회의')==='#f83a22',{me:chipEc('내 일정'),team:chipEc('팀 회의'),key:localStorage.getItem(KEY)});
  // 연결 해제 → 색 키도 삭제(선택 키와 같이)
  await openGoogleTab();btn('연결 해제').click();await sleep(50);
  check('연결 해제 시 색 키 삭제',localStorage.getItem(KEY)===null&&localStorage.getItem('routine-cal-google-cals')===null);
});
</script>
</body></html>
