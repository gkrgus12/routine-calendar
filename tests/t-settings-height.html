<!-- variants: s=wide@1400x1000 s=narrow@600x800 s=short@1400x500 -->
<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>설정 모달 고정 높이</title>
<link rel="stylesheet" href="../styles.css"></head>
<body><div class="app" id="app"></div>
<script src="lib.js"></script>
<script>
// 다섯 탭(일반/약속/구글/백업/알림)을 전환해도 모달의 상단·하단이 움직이지 않아야 한다. 높이 = min(가장 긴 탭 내용 + 헤더 등, 뷰포트 85%).
// wide(1400×1000): 가장 긴 탭이 스크롤 없이 들어감. short(1400×500): 캡에 걸려 패널 안에서 스크롤. narrow(600×800): 하단 시트도 같은 규칙
run(async()=>{
  seed({pages:[{id:'p1',name:'학교',color:0,active:true,colorByLabel:false,items:[]}],events:[{id:'e1',title:'로컬',startDate:'2026-10-14',endDate:'2026-10-14',startTime:'10:00',endTime:'11:00'}],
    settings:{defaultStart:'10:00',defaultDur:60}});
  window.GOOGLE_CLIENT_ID='test-client'; // 구글 탭이 연결 버튼·안내까지 그리도록
  await loadApp();
  btn('⚙ 설정').click();await sleep(60);
  const md=()=>document.querySelector('.md.settings');
  const pane=()=>md().querySelector('.spane');
  const contentH=()=>{const p=pane(),pr=p.getBoundingClientRect();const bottom=[...p.children].reduce((m,c)=>Math.max(m,c.getBoundingClientRect().bottom+(parseFloat(getComputedStyle(c).marginBottom)||0)),pr.top);return bottom-pr.top+parseFloat(getComputedStyle(p).paddingBottom)}; // 패널 내용 높이 = 마지막 자식 바닥(+margin) + 아래 패딩 (scrollHeight 는 clientHeight 밑으로 안 내려가서 못 씀)
  const TABS=['일반','약속','구글','백업','알림'];
  const rects={},inner={};
  for(const t of TABS){btn(t).click();await sleep(20);const r=md().getBoundingClientRect();rects[t]={top:r.top,bottom:r.bottom,height:r.height};inner[t]={content:contentH(),client:pane().clientHeight,scroll:pane().scrollHeight}}
  const ref=rects['일반'];const cap=Math.floor(innerHeight*0.85);
  const chrome=ref.height-pane().getBoundingClientRect().height;
  const need=Math.ceil(Math.max(...TABS.map(t=>inner[t].content))+chrome);
  const tallest=TABS.reduce((a,t)=>inner[t].content>inner[a].content?t:a,TABS[0]);
  const shortest=TABS.reduce((a,t)=>inner[t].content<inner[a].content?t:a,TABS[0]);
  log({vh:innerHeight,cap,chrome,need,inner});
  check('다섯 탭 전환: 상단·하단 불변',TABS.every(t=>near(rects[t].top,ref.top,.5)&&near(rects[t].bottom,ref.bottom,.5)),rects);
  check('모달 높이 ≤ 뷰포트 85%',ref.height<=cap+1,{height:ref.height,cap});
  check('모달 높이 = min(가장 긴 탭 + 헤더, 85%)',near(ref.height,Math.min(need,cap),2),{height:ref.height,need,cap});
  if(need<=cap){
    check('가장 긴 탭('+tallest+')이 스크롤 없이 들어감',inner[tallest].content<=inner[tallest].client+1,inner[tallest]);
  }else{
    check('캡에 걸림: 가장 긴 탭('+tallest+')은 패널 안에서만 스크롤',inner[tallest].scroll>inner[tallest].client&&getComputedStyle(pane()).overflowY==='auto',inner[tallest]);
  }
  check('짧은 탭('+shortest+')은 아래를 비워 둠',inner[shortest].content<inner[shortest].client-8,inner[shortest]);
  if(V==='wide')check('전제: 넓은 창에서는 캡에 안 걸림',need<=cap,{need,cap});
  if(V==='short')check('전제: 작은 창에서는 캡에 걸림',need>cap&&near(ref.height,cap,1.5),{need,cap,height:ref.height});
  if(V==='narrow')check('하단 시트(.grab 있음)이고 바닥에 붙음',!!md().querySelector('.grab')&&near(ref.bottom,innerHeight,2),{bottom:ref.bottom,vh:innerHeight});
  // 값을 바꿔 패널이 다시 그려져도 높이 불변 (일반 탭 테마 세그먼트)
  btn('일반').click();await sleep(20);btn('다크').click();await sleep(30);
  const r2=md().getBoundingClientRect();
  check('설정 변경(다시 그림) 뒤에도 불변',near(r2.top,ref.top,.5)&&near(r2.bottom,ref.bottom,.5),{top:r2.top,bottom:r2.bottom});
  btn('시스템').click();await sleep(20);
  btn('알림').click();await sleep(20);btn('알림').click();await sleep(20);
  const r3=md().getBoundingClientRect();
  check('탭 재클릭 뒤에도 불변',near(r3.top,ref.top,.5)&&near(r3.bottom,ref.bottom,.5));
  dispatchEvent(new Event('resize'));await sleep(20);
  const r4=md().getBoundingClientRect();
  check('resize 뒤 다시 계산해도 같은 값',near(r4.height,ref.height,1));
});
</script>
</body></html>
