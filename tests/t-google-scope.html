<!-- variants: s=A s=B s=C s=D -->
<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>구글 스코프</title>
<link rel="stylesheet" href="../styles.css"></head>
<body><div class="app" id="app"></div>
<script src="lib.js"></script>
<script>
// GIS 토큰 클라이언트와 fetch 를 스텁해 연결 흐름을 검사한다. 실제 구글에는 접근하지 않는다.
// A: calendar.events 토큰 → 연결·이메일·읽기·추가·수정·삭제 전부 403 없이
// B: 권한 없는 토큰 → 미연결 + "다시 연결 (권한 허용)" → prompt:'consent' 로 재요청 → 권한 있는 토큰 → 연결
// C: 토큰은 정상이지만 API 가 403 scope 부족 → B 와 같은 처리
// D: 연결 플래그 + 로그인 유지 → 로드 시 prompt:'none' + hint 로 조용히 재연결
const SCN=V||'A';
const EVENTS_SCOPE='https://www.googleapis.com/auth/calendar.events';
const tokens={
  A:[{access_token:'tokA',expires_in:3599,scope:EVENTS_SCOPE,token_type:'Bearer'}],
  B:[{access_token:'tokB1',expires_in:3599,scope:'openid https://www.googleapis.com/auth/userinfo.email'},{access_token:'tokB2',expires_in:3599,scope:EVENTS_SCOPE+' openid'}],
  C:[{access_token:'tokC',expires_in:3599,scope:EVENTS_SCOPE}],
  D:[{access_token:'tokD',expires_in:3599,scope:EVENTS_SCOPE}],
}[SCN];
const reqs=[];
window.GOOGLE_CLIENT_ID='test-client';
window.google={accounts:{oauth2:{
  initTokenClient(cfg){log('initTokenClient scope=',cfg.scope);return {requestAccessToken(req){reqs.push(req);log('requestAccessToken',req);const t=tokens.shift();setTimeout(()=>cfg.callback(t||{error:'cancelled'}),0)}}},
  revoke(t,cb){log('revoke',t);cb&&cb()}
}}};
const calls=[];
const scope403={error:{code:403,message:'Request had insufficient authentication scopes.',errors:[{message:'Insufficient Permission',domain:'global',reason:'insufficientPermissions'}],status:'PERMISSION_DENIED',details:[{'@type':'type.googleapis.com/google.rpc.ErrorInfo',reason:'ACCESS_TOKEN_SCOPE_INSUFFICIENT',domain:'googleapis.com'}]}};
const resp=(c,status,body)=>{c.status=status;return Promise.resolve({ok:status>=200&&status<300,status,statusText:status===403?'Forbidden':'OK',json:()=>body===undefined?Promise.reject(new Error('no body')):Promise.resolve(body)})};
window.fetch=(url,init)=>{
  const m=(init&&init.method)||'GET';const auth=init&&init.headers&&init.headers.Authorization;
  const c={m,url,auth,body:init&&init.body?JSON.parse(init.body):null};calls.push(c);log('fetch',m,url);
  const u=new URL(url);
  if(!/^\/calendar\/v3\/calendars\/primary\/events(\/|$)/.test(u.pathname))return resp(c,403,scope403); // calendars.get 등 events 밖 → 실제 구글처럼 403
  if(SCN==='C'&&m==='GET')return resp(c,403,scope403);
  if(m==='GET'&&u.searchParams.get('fields')==='summary')return resp(c,200,{summary:'me@example.com'});
  if(m==='GET')return resp(c,200,{summary:'me@example.com',items:[{id:'e1',summary:'구글 일정',start:{dateTime:'2026-10-14T10:00:00+09:00'},end:{dateTime:'2026-10-14T11:00:00+09:00'}}]});
  if(m==='POST')return resp(c,200,{id:'new1'});
  if(m==='PATCH')return resp(c,200,{id:'e1'});
  if(m==='DELETE')return resp(c,204,undefined);
  return resp(c,500,{error:{message:'unexpected'}});
};
if(SCN==='D'){localStorage.setItem('routine-cal-google-linked','1');localStorage.setItem('routine-cal-google-hint','me@example.com')}

run(async()=>{
  await loadApp();
  const pane=()=>text('.md.settings');
  const no403=()=>calls.filter(c=>c.status===403).map(c=>c.m+' '+c.url);
  const outsideEvents=()=>calls.filter(c=>!/\/calendars\/primary\/events(\/|\?|$)/.test(c.url)).map(c=>c.url);
  await sleep(100);
  btn('⚙ 설정').click();await sleep(100);btn('구글').click();await sleep(50);
  if(SCN!=='D'){btn('Google 연결').click();await sleep(300)}
  log('pane after connect:',pane().slice(0,200));log('toast after connect:',toastText());
  if(SCN==='A'||SCN==='D'){
    check('연결됨 + 이메일',/연결됨: me@example\.com/.test(pane()),pane().slice(0,120));
    check('403 없음',no403().length===0,no403().join(', '));
    check('모든 호출이 primary/events 아래',outsideEvents().length===0,outsideEvents().join(', '));
    check('이메일은 events.list summary 로',calls.some(c=>c.m==='GET'&&/fields=summary/.test(c.url)));
    if(SCN==='D'){check('조용한 재연결: prompt none + hint',reqs[0]&&reqs[0].prompt==='none'&&reqs[0].hint==='me@example.com',reqs[0]);check('실패 토스트 없음',!/실패/.test(toastText()),toastText())}
    else check('수동 연결: prompt 빈 문자열',reqs[0]&&reqs[0].prompt==='',reqs[0]);
    btn('닫기').click();await sleep(100);
    RC.view.type='month';RC.view.ym='2026-10';RC.render();await sleep(300);
    check('events.list(timeMin) 200',calls.some(c=>c.m==='GET'&&/timeMin=/.test(c.url)&&c.status===200));
    check('구글 이벤트 렌더',document.body.innerText.includes('구글 일정'));
    // 약속 추가 → POST
    btn('+ 약속').click();await sleep(100);
    const md=document.querySelector('.md:not(.settings)');const title=md&&md.querySelector('input[type=text]');
    check('약속 폼 열림',!!title);
    if(title){title.value='테스트 약속';title.dispatchEvent(new Event('input',{bubbles:true}));btn('추가').click();await sleep(300)}
    const post=calls.find(c=>c.m==='POST');
    check('POST events 200 + summary',!!post&&post.status===200&&post.body&&post.body.summary==='테스트 약속',post?post.body:'no POST');
    check('추가 토스트',/추가했어요/.test(toastText()),toastText());
    // 구글 일정 클릭 → 제목 수정 → PATCH
    const chip=[...document.querySelectorAll('.ev')].find(e=>e.textContent.includes('구글 일정'));
    check('구글 일정 칩',!!chip);
    if(chip){chip.click();await sleep(100);const md2=document.querySelector('.md:not(.settings)');const t2=md2&&md2.querySelector('input[type=text]');
      if(t2){t2.value='수정됨';t2.dispatchEvent(new Event('input',{bubbles:true}));btn('저장').click();await sleep(300)}}
    const patch=calls.find(c=>c.m==='PATCH');
    check('PATCH events/e1 200',!!patch&&patch.status===200&&patch.body&&patch.body.summary==='수정됨'&&/events\/e1$/.test(patch.url),patch?patch.url:'no PATCH');
    const chip2=[...document.querySelectorAll('.ev')].find(e=>e.textContent.includes('구글 일정'));
    if(chip2){chip2.click();await sleep(100);btn('삭제').click();await sleep(300)}
    const del=calls.find(c=>c.m==='DELETE');
    check('DELETE events/e1 204',!!del&&del.status===204&&/events\/e1$/.test(del.url),del?del.url:'no DELETE');
    check('끝까지 403 없음',no403().length===0,no403().join(', '));
    check('끝까지 primary/events 아래만',outsideEvents().length===0,outsideEvents().join(', '));
  }
  if(SCN==='B'){
    check('미연결 + 권한 안내',/권한이 허용되지 않아/.test(pane())&&!/연결됨/.test(pane()),pane().slice(0,200));
    check('"다시 연결 (권한 허용)" 버튼',!!btn('다시 연결 (권한 허용)'));
    check('권한 없는 토큰은 한 번도 쓰지 않음',!calls.some(c=>c.auth==='Bearer tokB1'));
    check('실패 토스트',/연결 실패/.test(toastText()),toastText());
    btn('다시 연결 (권한 허용)').click();await sleep(300);
    check('재요청은 prompt consent',reqs[1]&&reqs[1].prompt==='consent',reqs[1]);
    check('권한 받은 뒤 연결됨',/연결됨: me@example\.com/.test(pane()),pane().slice(0,120));
    check('403 없음',no403().length===0,no403().join(', '));
  }
  if(SCN==='C'){
    check('미연결 + 권한 안내',/권한이 허용되지 않아/.test(pane())&&!/연결됨/.test(pane()),pane().slice(0,200));
    check('"다시 연결 (권한 허용)" 버튼',!!btn('다시 연결 (권한 허용)'));
    check('토스트에 403',/403/.test(toastText()),toastText());
    check('summary 호출 하나만 나감',calls.length===1&&/fields=summary/.test(calls[0].url),calls.map(c=>c.url).join(', '));
    btn('다시 연결 (권한 허용)').click();await sleep(300);
    check('재요청은 prompt consent',reqs[1]&&reqs[1].prompt==='consent',reqs[1]);
    check('동의 취소돼도 버튼 유지',!!btn('다시 연결 (권한 허용)'),pane().slice(0,200));
  }
});
</script>
</body></html>
