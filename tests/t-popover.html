<!-- variants: s=wide@1400x900 s=narrow@600x800 -->
<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>팝오버 배치</title>
<link rel="stylesheet" href="../styles.css"></head>
<body><div class="app" id="app"></div>
<script src="lib.js"></script>
<script>
// openPopover 규칙: 기준 사각형(클릭한 요소 → 클릭 지점) 순으로 오른쪽(r.right+10, 폭 360 이 vw-12 안에 들어가면) → 왼쪽(r.left-10-360 >= 12)
// → 둘 다 안 되면 지점 기준 오른쪽을 화면 안으로 클램프. 세로는 팝오버 위쪽을 기준점 상단에 맞추고, 아래가 부족하면 vh-12-높이 까지 올린다.
// 창 너비 720 이하(narrow 변형)는 팝오버 대신 하단 시트.
run(async()=>{
  seed({pages:[{id:'p1',name:'학교',color:0,active:true,colorByLabel:false,items:[{id:'i1',day:0,start:'13:00',end:'14:00',label:'수업'}]}],
    events:[{id:'A',title:'A 월요일 아침',startDate:'2026-10-12',endDate:'2026-10-12',startTime:'09:00',endTime:'10:00'},
            {id:'B',title:'B 일요일 아침',startDate:'2026-10-18',endDate:'2026-10-18',startTime:'09:00',endTime:'10:00'},
            {id:'C',title:'C 일요일 밤',startDate:'2026-10-18',endDate:'2026-10-18',startTime:'22:00',endTime:'23:00'}],
    settings:{defaultStart:'10:00',defaultDur:60,weekStart:'mon',dayStart:6,dayEnd:24}});
  await loadApp();
  const vw=innerWidth,vh=innerHeight,W=360,GAP=10,M=12;
  const pop=()=>document.querySelector('.md.pop');
  const closePop=async()=>{document.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape'}));await sleep(30)};
  const clickAt=(el,x,y)=>el.dispatchEvent(new MouseEvent('click',{bubbles:true,clientX:x,clientY:y}));
  const blockOf=t=>[...document.querySelectorAll('.blk.evb')].find(b=>b.title.startsWith(t));
  const expectTop=(aTop,h)=>Math.max(M,Math.min(vh-M-h,aTop));
  const rectOf=el=>{const r=el.getBoundingClientRect();return {left:r.left,right:r.right,top:r.top,bottom:r.bottom,width:r.width,height:r.height}};

  // 주간: 2026-10-12 주
  RC.view.type='week';RC.view.weekStart=new Date(2026,9,12);RC.render();await sleep(30);
  log('viewport',{vw,vh});
  if(V==='narrow'){
    const b=blockOf('A');const r=rectOf(b);clickAt(b,r.left+5,r.top+5);await sleep(30);
    const md=document.querySelector('.ov .md');
    check('좁은 폭: 하단 시트(.pop 없음, .grab 있음)',!!md&&!md.classList.contains('pop')&&!!md.querySelector('.grab'),{vw});
    check('좁은 폭: 팝오버 없음',!pop());
    await closePop();check('Esc 로 시트 닫힘',!document.querySelector('.ov'));
    return;
  }
  check('전제: 데스크톱 폭(>720)',vw>720,{vw});

  // 1. 월요일 블록 → 오른쪽, 위쪽 모서리 = 블록 상단
  let b=blockOf('A'),r=rectOf(b);clickAt(b,r.left+10,r.top+10);await sleep(30);
  let p=pop(),pr=p&&rectOf(p);
  check('월요일 블록: 오른쪽',!!p&&p.dataset.side==='right'&&near(pr.left,r.right+GAP),{side:p&&p.dataset.side,left:pr&&pr.left,expect:r.right+GAP});
  check('월요일 블록: 위쪽 모서리 = 블록 상단',!!p&&near(pr.top,expectTop(r.top,pr.height)),{top:pr&&pr.top,expect:pr&&expectTop(r.top,pr.height)});
  check('팝오버 폭 360',!!p&&near(pr.width,W),pr&&pr.width);
  check('투명 오버레이(.ov.clear), 그랩 핸들 없음',!!document.querySelector('.ov.clear')&&!p.querySelector('.grab'));
  check('transform-origin 은 왼쪽 위',p.style.transformOrigin==='0px 0px',p.style.transformOrigin);
  await closePop();check('Esc 로 닫힘',!pop());

  // 2. 일요일 블록 → 오른쪽에 안 들어가 왼쪽
  b=blockOf('B');r=rectOf(b);clickAt(b,r.left+10,r.top+10);await sleep(30);p=pop();pr=rectOf(p);
  check('전제: 일요일 블록 오른쪽 자리 부족',r.right+GAP+W>vw-M,{right:r.right,vw});
  check('일요일 블록: 왼쪽',p.dataset.side==='left'&&near(pr.left,r.left-GAP-W),{side:p.dataset.side,left:pr.left,expect:r.left-GAP-W});
  check('일요일 블록: 상단 정렬',near(pr.top,expectTop(r.top,pr.height)),{top:pr.top,expect:expectTop(r.top,pr.height)});
  check('transform-origin 은 오른쪽 위',p.style.transformOrigin===W+'px 0px',p.style.transformOrigin);
  await closePop();

  // 3. 일요일 밤 블록 → 아래가 부족해 위로 밀림, 화면 안
  b=blockOf('C');r=rectOf(b);clickAt(b,r.left+10,r.top+10);await sleep(30);p=pop();pr=rectOf(p);
  check('전제: 블록 아래 공간 부족',r.top+pr.height>vh-M,{blockTop:r.top,h:pr.height,vh});
  check('일요일 밤: 위로 밀려 vh-12 에 맞춤',pr.top<r.top&&near(pr.top,vh-M-pr.height)&&pr.bottom<=vh-M+1,{top:pr.top,bottom:pr.bottom,blockTop:r.top,vh});
  check('일요일 밤: 여전히 왼쪽',p.dataset.side==='left');
  await closePop();

  // 4·5. 월간 칸 클릭 → 요소 없이 클릭 지점 기준 (첫 줄 첫 칸 = 오른쪽, 첫 줄 마지막 칸 = 왼쪽)
  RC.view.type='month';RC.view.ym='2026-10';RC.render();await sleep(30);
  const cells=[...document.querySelectorAll('.mgrid .day')];
  let cr=rectOf(cells[0]),x=cr.left+20,y=cr.top+20;clickAt(cells[0],x,y);await sleep(30);p=pop();pr=rectOf(p);
  check('월간 첫 칸: 클릭 지점 오른쪽·위',p.dataset.side==='right'&&near(pr.left,x+GAP)&&near(pr.top,expectTop(y,pr.height)),{left:pr.left,top:pr.top,x,y});
  await closePop();
  cr=rectOf(cells[6]);x=cr.right-20;y=cr.top+20;clickAt(cells[6],x,y);await sleep(30);p=pop();pr=rectOf(p);
  check('월간 마지막 칸: 클릭 지점 왼쪽',p.dataset.side==='left'&&near(pr.left,x-GAP-W),{left:pr.left,expect:x-GAP-W,x});
  await closePop();

  // 6. + 약속 버튼(오른쪽 상단) → 버튼 왼쪽, 버튼 상단에 맞춤
  const add=btn('+ 약속');const ar=rectOf(add);clickAt(add,ar.left+5,ar.top+5);await sleep(30);p=pop();pr=rectOf(p);
  check('+ 약속 버튼: 왼쪽 + 상단 정렬',p.dataset.side==='left'&&near(pr.left,ar.left-GAP-W)&&near(pr.top,expectTop(ar.top,pr.height)),{left:pr.left,expect:ar.left-GAP-W,top:pr.top,btnTop:ar.top});
  await closePop();

  // 7. 일간 뷰: 폭 전체 블록은 양쪽 다 안 들어가 클릭 지점 기준
  RC.view.type='day';RC.view.day='2026-10-12';RC.render();await sleep(30);
  b=blockOf('A');r=rectOf(b);x=Math.round((r.left+r.right)/2);y=r.top+10;clickAt(b,x,y);await sleep(30);p=pop();pr=rectOf(p);
  check('전제: 일간 블록은 좌우 어느 쪽에도 안 들어감',!(r.right+GAP+W<=vw-M||r.left-GAP-W>=M),{left:r.left,right:r.right,vw});
  check('일간 블록: 지점 오른쪽',p.dataset.side==='right'&&near(pr.left,Math.min(vw-M-W,Math.max(M,x+GAP)))&&near(pr.top,expectTop(y,pr.height)),{left:pr.left,x,top:pr.top,y});
  await closePop();

  // 8. 바깥 클릭으로 닫힘, 경고 박스로 높이가 바뀌어도 화면 안
  b=blockOf('A');r=rectOf(b);clickAt(b,r.left+10,r.top+10);await sleep(30);p=pop();
  const ov=document.querySelector('.ov.clear');ov.dispatchEvent(new MouseEvent('click',{bubbles:true}));await sleep(30);
  check('바깥 클릭으로 닫힘',!pop()&&!document.querySelector('.ov'));
  // 아래쪽 블록을 열고 끝 시간을 늘려 충돌 박스가 생겨도(학교 13~14시와 겹치게) 팝오버가 화면 안에 남는다
  RC.view.type='week';RC.view.weekStart=new Date(2026,9,12);RC.render();await sleep(30);
  b=blockOf('C');r=rectOf(b);clickAt(b,r.left+10,r.top+10);await sleep(30);p=pop();
  const sd=p.querySelector('input[type=date]');sd.value='2026-10-12';sd.dispatchEvent(new Event('input',{bubbles:true}));
  const st=p.querySelectorAll('input[type=time]');st[0].value='12:30';st[0].dispatchEvent(new Event('input',{bubbles:true}));st[1].value='13:30';st[1].dispatchEvent(new Event('input',{bubbles:true}));await sleep(60);
  pr=rectOf(p);
  check('충돌 박스 생김',!!p.querySelector('.cfbox'));
  check('높이가 늘어도 화면 안(아래 12px 여백)',pr.bottom<=vh-M+1&&pr.top>=M-1,{top:pr.top,bottom:pr.bottom,vh});
  await closePop();
});
</script>
</body></html>
